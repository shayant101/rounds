<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rounds · Three screens</title>
<link rel="icon" href="brand/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B0D0B;--ink:#F2F5F0;--ink-2:#A6AEA2;--teal:#81E40A;--rule:#2A2F29}
  :root[data-theme="light"]{--bg:#F6F8F4;--ink:#0B0D0B;--ink-2:#5B655A;--rule:#DCE3D9}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:700 16px/1.4 "Nunito",system-ui,sans-serif}
  .wrap{max-width:1500px;margin:0 auto;padding:16px}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:26px;margin:0;font-weight:900} .top a{color:var(--teal);text-decoration:none;font-weight:900}
.home{display:inline-flex} .mark{width:40px;height:40px;object-fit:contain} .light-only{display:none} .dark-only{display:block} :root[data-theme="light"] .light-only{display:block} :root[data-theme="light"] .dark-only{display:none}
  .top .open{background:var(--teal);color:#0B0D0B;border-radius:999px;padding:8px 14px;min-height:44px;display:inline-flex;align-items:center}
  .seg{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .seg button{display:inline-flex;align-items:center;gap:6px;font:inherit;color:var(--ink);background:transparent;border:2px solid var(--rule);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px}
  .seg button[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}
  .seg button svg{width:18px;height:18px}
  .stage[data-d]:not([data-d="all"]) .dev{display:none} .stage[data-d="laptop"] .dev.laptop,.stage[data-d="tablet"] .dev.tablet,.stage[data-d="phone"] .dev.phone{display:grid}
  .stage[data-d]:not([data-d="all"]){grid-template-columns:1fr;justify-items:center}
  .stage{display:grid;gap:28px;justify-items:center;align-items:end;max-width:100%;overflow-x:auto;padding:0 40px 20px}
  @media(min-width:1200px){.stage{grid-template-columns:auto auto auto}}
  .dev{display:grid;justify-items:center;gap:10px} .dev h2{margin:0;font-size:14px;color:var(--ink-2);font-weight:900;letter-spacing:.02em}
  .frame{position:relative;box-sizing:content-box;background:#111;border-radius:28px;box-shadow:0 30px 70px rgba(0,0,0,.45);border:2px solid #2a2a2a;overflow:hidden}
  .frame iframe{border:0;display:block;transform-origin:top left;background:#fff}
  .laptop .frame{border-radius:16px 16px 4px 4px;border-width:10px;border-color:#1c1c1c}
  .laptop .base{width:calc(100% + 60px);max-width:calc(100vw - 32px);height:14px;background:linear-gradient(#2a2a2a,#151515);border-radius:0 0 14px 14px;margin-top:-10px}
  .tablet .frame{border-width:14px;border-color:#1c1c1c;border-radius:30px}
  .phone .frame{border-width:10px;border-color:#1c1c1c;border-radius:40px}
  .phone .frame::after{content:"";position:absolute;left:50%;top:10px;transform:translateX(-50%);width:90px;height:22px;background:#1c1c1c;border-radius:12px}
  .phone .frame iframe{margin-top:40px}
  .note{color:var(--ink-2);font-size:14px;margin-top:18px;font-weight:700}
</style></head>
<body><div class="wrap">
  <div class="top"><a class="home" href="../" title="Back to start"><img class="mark light-only" src="brand/mark-black.png" alt="rounds"><img class="mark dark-only" src="brand/mark-grey.png" alt="rounds"></a><h1>Three screens</h1><a href="../">← Back to start</a><a class="open" id="openFull" href="../app/">Open full screen →</a>
    <div class="seg" id="dev"><button data-d="laptop" title="Laptop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 19h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Laptop</span></button><button data-d="tablet" title="Tablet"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="17.5" r="1" fill="currentColor"/></svg><span>Tablet</span></button><button data-d="phone" title="Phone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 5.5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Phone</span></button><button data-d="all">All three</button></div>
    <div class="seg" id="seg" style="margin-left:0"><button data-p="app/" aria-pressed="true">Floor</button><button data-p="program/">Program view</button></div></div>
  <div class="stage">
    <div class="dev laptop"><h2>Laptop</h2><div class="frame" id="f1"></div><div class="base"></div></div>
    <div class="dev tablet"><h2>Tablet</h2><div class="frame" id="f2"></div></div>
    <div class="dev phone"><h2>Phone</h2><div class="frame" id="f3"></div></div>
  </div>
  <p class="note">All three are the live app with the same data on this device. Tap inside any of them.</p>
</div>
<script>
(function(){
  try{var t=localStorage.getItem("rounds.theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}
  var D=[{el:'f1',w:1280,h:800,s:0.5,b:10,top:0},{el:'f2',w:820,h:1100,s:0.5,b:14,top:0},{el:'f3',w:390,h:804,s:0.62,b:10,top:40}];
  var q=new URLSearchParams(location.search); var path=q.get('p')==='program/'?'program/':'app/'; var dev=['laptop','tablet','phone','all'].indexOf(q.get('d'))>=0?q.get('d'):'all';
  var stage=document.querySelector('.stage');
  function setDev(d){ dev=d; stage.setAttribute('data-d',d); document.querySelectorAll('#dev [data-d]').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.d===d));}); history.replaceState(null,'','?d='+d+'&p='+path); fit(); }
  function fit(){
    var vw=Math.min(window.innerWidth-32,1468)-80;
    var three=dev==='all'&&window.innerWidth>=1200;
    var k=1;
    if(three){ var total=0; D.forEach(function(d){total+=d.w*d.s+2*d.b;}); total+=56; k=Math.min(1,vw/total); }
    D.forEach(function(d){ var el=document.getElementById(d.el); var s;
      if(three) s=d.s*k; else if(dev==='all') s=Math.min(d.s,(vw-2*d.b)/d.w);
      else { var vh=window.innerHeight-200; s=Math.min(1,(vw-2*d.b)/d.w,(vh-d.top-2*d.b)/d.h); }
      el.style.width=(d.w*s)+'px'; el.style.height=(d.h*s+d.top)+'px';
      var f=el.querySelector('iframe'); if(f){f.style.width=d.w+'px';f.style.height=d.h+'px';f.style.transform='scale('+s+')';} });
  }
  function load(){ D.forEach(function(d){var el=document.getElementById(d.el); el.innerHTML='<iframe src="../'+path+'" title="'+d.el+'"></iframe>';}); fit(); }
  document.querySelectorAll('#dev [data-d]').forEach(function(b){b.onclick=function(){setDev(b.dataset.d);};});
  document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){path=b.dataset.p; document.getElementById('openFull').href='../'+path; history.replaceState(null,'','?d='+dev+'&p='+path); document.querySelectorAll('[data-p]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));}); load();};});
  window.addEventListener('resize',fit); document.querySelectorAll('[data-p]').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.p===path));}); document.getElementById('openFull').href='../'+path; setDev(dev); load();
})();
</script></body></html>
